<!DOCTYPE html>
<html lang="en">
<head>
	
  <title> Are you FOUND? </title>
<style>	
  .map-container {
  position: relative;
  display: inline-block;
}

.appear {
  position: absolute;
  left: 1086px;
  top: 822px;
  width: 511px;  /* 1597px - 1086px being the coordinates of the image */
  height: 402px; /* 1224px - 822px being the coordinates of the image*/
  
  color: transparent; 
  background: transparent;
  text-decoration: none;
}

.appear img {
  width: 100%;
  height: 100%;
  opacity: 0;
  transition: opacity 0.2s ease-in-out;
}

.appear:hover img, 
.appear:focus img {
  opacity: 1;
}

.appear:hover span,
.appear:focus span {
  color: #000;
  background: #fff;
  position: absolute;
  bottom: 10px;
  left: 10px;
}
	
</style>	
	
</head>
